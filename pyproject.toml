[project]
name = "dispatch-psa"
version = "0.1.0"
description = "Synthetic NorthPoint IT helpdesk API for the Dispatch portfolio demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "mcp (>=2.3,<3)",
    "httpx2 (>=2,<3)",
    "anyio (>=4,<5)",
    "fastembed (>=0.9,<0.10)",
    "huggingface-hub (>=1,<2)",
    "openai (>=3.29.0,<4.0.0)",
    "langfuse (>=4.17,<5)",
]

[tool.poetry]
packages = [{ include = "dispatch", from = "src" }]
include = [{ path = "web/index.html", format = ["sdist", "wheel"] }, { path = "web/assets", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
ruff = ">=0.9,<1.0"
playwright = ">=1.50,<2"

[tool.poetry.group.evals]
optional = true

[tool.poetry.group.evals.dependencies]
deepeval = "^4.2.8"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
